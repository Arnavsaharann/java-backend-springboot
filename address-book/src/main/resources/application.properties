# Application name (used in logs and management endpoints)
spring.application.name=address-book

# Default active profile (can be overridden via command line: --spring.profiles.active=prod)
spring.profiles.active=dev

# Common server settings
server.port=8080

# MySQL database configuration (used by all profiles)
spring.datasource.url=jdbc:mysql://localhost:3306/addressbookdb?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Noddy2003
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# Common logging settings (overridden by profile-specific files)
logging.level.root=INFO
logging.level.com.example.address_book=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO